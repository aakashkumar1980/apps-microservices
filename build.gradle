plugins {
  id 'java'
  id 'application'
}

group = 'com.example.tutorial'
version = '0.0.1'

repositories {
  mavenCentral()
}

/** Library versions */
def vertxVersion        = '4.5.9'
def jacksonVersion      = '2.17.1'
def junitJupiterVersion = '5.10.2'
def ioUtilsVersion = '2.19.0'
def commonsLangVersion = '3.17.0'
def commonsBeanUtilsVersion = '1.11.0'

java {
  // Change to 11 or 8 if you need to match your environment
  toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
  /** Vert.x CORE **/
  implementation platform("io.vertx:vertx-stack-depchain:${vertxVersion}")
  implementation "io.vertx:vertx-core"
  implementation "io.vertx:vertx-web"
  implementation "io.vertx:vertx-config"
  implementation "io.vertx:vertx-config-yaml"
  implementation "io.vertx:vertx-web-client"   // handy for internal HTTP calls (optional)

  // JSON
  implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
  implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
  implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"


  /** UTILITIES **/
  implementation("org.apache.commons:commons-lang3:${commonsLangVersion}") {
    exclude group: "org.slf4j" // Avoid duplicate logging libraries
  }
  implementation "commons-io:commons-io:${ioUtilsVersion}"
  implementation "commons-beanutils:commons-beanutils:${commonsBeanUtilsVersion}"

  // Tests
  testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
}

application {
  // Single bootstrap (your only server on one port)
  mainClass = 'com.example.tutorial.VertxStartupApi'
}

tasks.test {
  useJUnitPlatform()
}

// Optional: keep compiler warnings consistent
tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 21    // set to 11 or 8 if you changed the toolchain above
}
